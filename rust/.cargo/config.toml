[env]
GODOT4_BIN = { value = "../../godot", relative = true, force = true }

# for using mold as the linker on linux:
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=/usr/bin/mold", "-Zshare-generics=y"]

# for using lld as the linker on linux:
# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# mold isnt available on windows, so just use lld
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

# macos linker is cracked as hell for some reason and is faster than lld and just as fast as mold

[target.wasm32-unknown-emscripten]
rustflags = [
	"-C",
	"link-args=-pthread",
	"-C",
	"target-feature=+atomics",
	"-C",
	"link-args=-sSIDE_MODULE=2",
	"-C",
	"llvm-args=-enable-emscripten-cxx-exceptions=0",
	"-Z",
	"default-visibility=hidden",
	"-Z",
	"link-native-libraries=no",
	"-Z",
	"emscripten-wasm-eh=false",
]
